name: v0.7 Lua and UI patch

on:
  push:
    branches:
      - feature/v0.7-extmarks-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/v07_ui_patch.py
      - name: Normalize generated v0.7 source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/lua_runtime.zig')
          lines = []
          single = '    ' + chr(92)
          double = '    ' + chr(92) * 2
          for line in p.read_text().splitlines():
              if line.startswith(single) and not line.startswith(double):
                  line = double + line[len(single):]
              lines.append(line)
          p.write_text('\n'.join(lines) + '\n')

          p = Path('src/editor.zig')
          text = p.read_text()
          text = text.replace('const cursor = self.cursor();\n                            try buffer.recordUndo(self.allocator, cursor);\n                            try buffer.insertBytesAt(self.allocator, cursor, insert_text);\n                            buffer.markChanged();\n                            self.currentWindow().cursor = cursor + insert_text.len;', 'const cursor_offset = self.cursor();\n                            try buffer.recordUndo(self.allocator, cursor_offset);\n                            try buffer.insertBytesAt(self.allocator, cursor_offset, insert_text);\n                            buffer.markChanged();\n                            self.currentWindow().cursor = cursor_offset + insert_text.len;', 1)
          p.write_text(text)
          PY
      - run: zig fmt src build.zig
      - run: npm install --no-audit --no-fund
      - run: npm run build:ui
      - run: zig build test-core -Dheadless-only=true
      - run: zig build test-integration
      - run: |
          git rm -f .github/workflows/v07-ui-patch.yml scripts/v07_ui_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src ui build.zig.zon
          git commit -m "feat: expose extmarks diagnostics and native plugin UI"
          git push