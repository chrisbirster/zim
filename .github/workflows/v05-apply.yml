name: v0.5 native patch

on:
  push:
    branches:
      - feature/v0.5-zen-workspace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: sed -i 's/LocationList = null;/LocationList = null,/g' scripts/v05_native_patch.py
      - run: python3 scripts/v05_native_patch.py
      - run: zig fmt src/editor_view.zig src/tui.zig src/lsp_bridge.zig src/app.zig src/plugin_manager.zig src/lua_runtime.zig build.zig.zon
      - run: |
          git rm -f .github/workflows/v05-apply.yml scripts/v05_native_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/editor_view.zig src/tui.zig src/lsp_bridge.zig src/app.zig src/plugin_manager.zig src/lua_runtime.zig build.zig.zon
          git commit -m "feat: bridge Zen workspace native state and focus"
          git push