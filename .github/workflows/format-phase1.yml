name: Format Phase 1

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/editor-core-parity-train'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editor-core-parity-train
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Format Zig sources
        run: zig fmt src build.zig
      - name: Remove one-shot workflow
        run: rm .github/workflows/format-phase1.yml
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format phase1 fidelity changes"
          git push origin HEAD:feature/editor-core-parity-train
