name: Fix Tree Focus Ownership

on:
  push:
    branches:
      - feature/v1.0-daily-driver

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[tree-focus-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0-daily-driver
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: python scripts/fix_tree_focus_ownership.py
      - run: zig fmt src build.zig
      - run: npm install --no-audit --no-fund && npm run build:ui
      - run: zig build test-core -Dheadless-only=true
      - name: Commit focus repair and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src ui
          git rm scripts/fix_tree_focus_ownership.py .github/workflows/fix-tree-focus-ownership.yml
          git commit -m "fix: make tree focus ownership explicit [tree-focus-fixed]"
          git push origin HEAD:feature/v1.0-daily-driver
