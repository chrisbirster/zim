name: Apply v1 blocker repairs v2

on:
  push:
    branches:
      - feature/v1.0-daily-driver

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0-daily-driver
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Apply exact repairs
        run: python scripts/fix-v1-blockers.py
      - name: Format
        run: zig fmt src/tui.zig src/terminal_io_windows.zig src/rpc/transport_windows.zig build.zig
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tui.zig src/terminal_io_windows.zig src/rpc/transport_windows.zig build.zig
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: unblock v1 command dispatch and Windows release build"
          git push origin HEAD:feature/v1.0-daily-driver
