name: Apply Vim Tree Patch

on:
  push:
    branches:
      - feature/v1.0-daily-driver

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[vim-tree-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0-daily-driver
          fetch-depth: 0
      - name: Apply hierarchical tree patch
        run: python scripts/apply_vim_tree_patch.py
      - name: Commit source repair and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor_view.zig
          git rm scripts/apply_vim_tree_patch.py .github/workflows/apply-vim-tree-patch.yml
          git commit -m "fix: add hierarchical project tree [vim-tree-applied]"
          git push origin HEAD:feature/v1.0-daily-driver
