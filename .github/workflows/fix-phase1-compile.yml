name: Fix Phase 1 Compile

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/editor-core-parity-train'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editor-core-parity-train
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Apply guarded compile fixes
        run: python3 .github/fix_phase1_compile.py
      - name: Format
        run: zig fmt src build.zig
      - name: Verify pure editor core
        run: zig build test-core -Dheadless-only=true
      - name: Remove one-shot fixer
        run: rm .github/fix_phase1_compile.py .github/workflows/fix-phase1-compile.yml
      - name: Commit verified compile fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize phase1 fidelity compile"
          git push origin HEAD:feature/editor-core-parity-train
