name: Fix Global Ex Entry

on:
  push:
    branches: [feature/v1.0-daily-driver]
    paths:
      - scripts/fix_global_ex_entry.py
      - .github/workflows/fix-global-ex-entry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0-daily-driver
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply global Ex entry repair
        run: python scripts/fix_global_ex_entry.py

      - name: Format Zig
        run: zig fmt src build.zig

      - name: Install UI dependencies
        run: npm ci --no-audit --no-fund

      - name: Test UI state
        run: npm run test:ui

      - name: Bundle UI
        run: npm run build:ui

      - name: Test core
        run: zig build test-core -Dheadless-only=true

      - name: Test Hondo integration in ReleaseSafe
        run: zig build test-integration -Doptimize=ReleaseSafe

      - name: Commit repair and remove helper
        shell: bash
        run: |
          rm scripts/fix_global_ex_entry.py
          rm .github/workflows/fix-global-ex-entry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make Ex entry global across TUI surfaces"
          git push origin HEAD:feature/v1.0-daily-driver
