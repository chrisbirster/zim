name: v1 format

on:
  push:
    branches:
      - feature/v1.0-daily-driver

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event.head_commit.message != 'style: zig fmt v1'
        with:
          ref: feature/v1.0-daily-driver
      - uses: mlugg/setup-zig@v2
        if: github.event.head_commit.message != 'style: zig fmt v1'
        with:
          version: 0.16.0
          use-cache: false
      - name: Format Zig sources
        if: github.event.head_commit.message != 'style: zig fmt v1'
        run: zig fmt src build.zig
      - name: Commit formatter output
        if: github.event.head_commit.message != 'style: zig fmt v1'
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src build.zig
          git commit -m "style: zig fmt v1"
          git push origin HEAD:feature/v1.0-daily-driver
