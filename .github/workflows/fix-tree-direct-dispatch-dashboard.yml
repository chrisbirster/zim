name: Fix Tree Direct Dispatch Dashboard

on:
  push:
    branches:
      - feature/v1.0-daily-driver

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[tree-direct-dashboard-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0-daily-driver
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/fix_tree_direct_dispatch_and_dashboard.py
      - run: zig fmt src build.zig
      - run: npm install --no-audit --no-fund && npm run build:ui
      - run: zig build test-core -Dheadless-only=true
      - run: zig build test-integration -Doptimize=ReleaseSafe
      - name: Commit repair and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src ui
          git rm scripts/fix_tree_direct_dispatch_and_dashboard.py .github/workflows/fix-tree-direct-dispatch-dashboard.yml
          git commit -m "fix: make tree input Zig-owned and complete dashboard contract [tree-direct-dashboard-applied]"
          git push origin HEAD:feature/v1.0-daily-driver
