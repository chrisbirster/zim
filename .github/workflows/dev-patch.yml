name: Apply v0.4 Dev Patch

on:
  push:
    branches: [feature/v0.4-plugin-system]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Apply source patch and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/plugin_manager.zig')
          text = path.read_text()
          old = '''        std.Io.Dir.cwd().deleteTree(self.io, path) catch |err| switch (err) {
                      error.FileNotFound => {},
                      else => return err,
                  };
          '''
          new = '''        try std.Io.Dir.cwd().deleteTree(self.io, path);
          '''
          if old not in text:
              raise SystemExit('expected deleteTree block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          zig fmt src/plugin_manager.zig
          git rm .github/workflows/dev-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/plugin_manager.zig
          git commit -m "fix: align plugin removal with Zig 0.16"
          git push
