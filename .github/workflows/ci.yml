name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Preserve LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Zig (Windows, no build cache)
        if: runner.os == 'Windows'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Check Zig formatting
        run: zig fmt --check src build.zig

      - name: Test Windows PTY platform boundary
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: zig build test-pty -Dpty-only=true -Dpty-test-filter="PTY platform boundary"

      - name: Test Windows PTY child lifecycle
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zim-pty-child-cache
        run: zig test src/pty.zig --test-filter "PTY runs a child"

      - name: Test Windows PTY nonblocking lifecycle
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zim-pty-nonblocking-cache
        run: zig test src/pty.zig --test-filter "PTY exposes nonblocking"

      - name: Test Windows terminal manager lifecycle
        if: runner.os == 'Windows'
        timeout-minutes: 2
        env:
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zim-terminal-cache
        run: zig test src/terminal.zig

      - name: Test pure Zig editor/headless core
        run: zig build test-core -Dheadless-only=true

      - name: Install ZLS 0.16.0 for real-server smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L --fail --retry 3 https://github.com/zigtools/zls/releases/download/0.16.0/zls-x86_64-linux.tar.xz -o "$RUNNER_TEMP/zls.tar.xz"
          echo "ded6d562a0b86ee878b1ddf70ffab2797ce3cdca3b02d6077548f9d56dff96b6  $RUNNER_TEMP/zls.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zls"
          tar -xJf "$RUNNER_TEMP/zls.tar.xz" -C "$RUNNER_TEMP/zls"
          echo "$RUNNER_TEMP/zls" >> "$GITHUB_PATH"

      - name: Test real ZLS stdio lifecycle
        if: runner.os == 'Linux'
        run: zig build test-zls-smoke

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        run: npm install --no-audit --no-fund

      - name: Test Solid/Hondo UI state
        run: npm run test:ui

      - name: Bundle Solid/Hondo UI
        run: npm run build:ui

      - name: Build ReleaseSafe Zim
        run: zig build -Doptimize=ReleaseSafe

      - name: Install Python for RPC smoke, benchmarks, and packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test macOS ReleaseSafe interactive startup
        if: runner.os == 'macOS'
        timeout-minutes: 1
        run: python scripts/interactive_smoke.py ./zig-out/bin/zim

      - name: Release packaging dry run
        run: python scripts/package_release.py

      - name: Daily Driver performance gate
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/benchmark.py ./zig-out/bin/zim.exe
          else
            python scripts/benchmark.py ./zig-out/bin/zim
          fi

      - name: Test MessagePack-RPC process boundary
        timeout-minutes: 2
        run: python scripts/rpc-smoke.py

      - name: Test Hondo integration in ReleaseSafe
        run: zig build test-integration -Doptimize=ReleaseSafe

      - name: Test full ReleaseSafe suite
        run: zig build test -Doptimize=ReleaseSafe
