name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Preserve LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Resolve release-candidate Hondo package hash
        run: zig fetch https://github.com/chrisbirster/hondo/archive/99b0c64f880428f6357e63e9b57b8dffa853db06.tar.gz

      - name: Check Zig formatting
        run: zig fmt --check src build.zig

      - name: Test pure Zig editor/headless core
        run: zig build test-core -Dheadless-only=true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle Solid/Hondo UI
        run: npm run build:ui

      - name: Build Zim
        run: zig build

      - name: Test Hondo integration
        run: zig build test-integration

      - name: Test full suite
        run: zig build test
