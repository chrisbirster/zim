name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Preserve LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check Zig formatting
        run: zig fmt --check src build.zig

      - name: Test pure Zig editor/headless core
        run: zig build test-core -Dheadless-only=true

      - name: Install ZLS 0.16.0 for real-server smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L --fail --retry 3 https://github.com/zigtools/zls/releases/download/0.16.0/zls-x86_64-linux.tar.xz -o "$RUNNER_TEMP/zls.tar.xz"
          echo "ded6d562a0b86ee878b1ddf70ffab2797ce3cdca3b02d6077548f9d56dff96b6  $RUNNER_TEMP/zls.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zls"
          tar -xJf "$RUNNER_TEMP/zls.tar.xz" -C "$RUNNER_TEMP/zls"
          echo "$RUNNER_TEMP/zls" >> "$GITHUB_PATH"

      - name: Test real ZLS stdio lifecycle
        if: runner.os == 'Linux'
        run: zig build test-zls-smoke

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install UI dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle Solid/Hondo UI
        run: npm run build:ui

      - name: Build Zim
        run: zig build

      - name: Test Hondo integration
        run: zig build test-integration

      - name: Test full suite
        run: zig build test
