name: Fix Vim Absolute Motion Parity

on:
  push:
    branches:
      - feature/v1.0-daily-driver

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[vim-absolute-parity-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0-daily-driver
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: python scripts/fix_vim_absolute_motion_parity.py
      - run: zig fmt src build.zig
      - run: zig build test-core -Dheadless-only=true
      - name: Commit parity repair and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git rm scripts/fix_vim_absolute_motion_parity.py .github/workflows/fix-vim-absolute-motion-parity.yml
          git commit -m "feat: finish Vim absolute-motion parity [vim-absolute-parity-applied]"
          git push origin HEAD:feature/v1.0-daily-driver
