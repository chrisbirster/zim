name: Apply v0.4 Source Polish

on:
  push:
    branches: [feature/v0.4-plugin-system]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Apply final source polish
        run: |
          echo '' | base64 --decode > /tmp/v04_patch.py
          python3 /tmp/v04_patch.py
          zig fmt src/plugin_manager.zig src/lua_runtime.zig
          git rm .github/workflows/v04-source-polish.yml
          if [ -f .ci-trigger ]; then git rm .ci-trigger; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/plugin_manager.zig src/lua_runtime.zig
          git commit -m "fix: isolate failed plugins and align v0.4 Lua version"
          git push
