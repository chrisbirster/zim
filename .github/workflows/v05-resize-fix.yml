name: v0.5 resize fix

on:
  push:
    branches:
      - feature/v0.5-zen-workspace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: python3 scripts/v05_resize_fix.py
      - run: zig fmt src/tui.zig
      - run: |
          git rm .github/workflows/v05-resize-fix.yml scripts/v05_resize_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tui.zig
          git commit -m "fix: simplify QuickJS resize bridge"
          git push