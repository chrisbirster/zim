name: Debug Zig Format

on:
  push:
    branches: [feature/v0.4-plugin-system]

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Apply canonical formatter output
        run: |
          zig fmt src/plugin_manager.zig
          if git diff --quiet -- src/plugin_manager.zig; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/plugin_manager.zig
          git commit -m "style: format plugin manager"
          git push
