name: Integrate UI State Tests

on:
  push:
    branches: [feature/v1.0-daily-driver]
    paths:
      - scripts/integrate_ui_state_tests.py
      - .github/workflows/integrate-ui-state-tests.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0-daily-driver
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate production UI helpers
        run: python scripts/integrate_ui_state_tests.py

      - name: Install UI dependencies
        run: npm install --no-audit --no-fund

      - name: Test UI state
        run: npm run test:ui

      - name: Bundle UI
        run: npm run build:ui

      - name: Test core
        run: zig build test-core -Dheadless-only=true

      - name: Test Hondo integration in ReleaseSafe
        run: zig build test-integration -Doptimize=ReleaseSafe

      - name: Commit integration and remove helper
        shell: bash
        run: |
          rm scripts/integrate_ui_state_tests.py
          rm .github/workflows/integrate-ui-state-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: integrate UI state unit tests into production"
          git push origin HEAD:feature/v1.0-daily-driver
