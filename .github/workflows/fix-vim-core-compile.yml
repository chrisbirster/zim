name: Fix Vim Core Compile

on:
  push:
    branches:
      - feature/v1.0-daily-driver

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[vim-compile-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0-daily-driver
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: python scripts/fix_vim_core_compile.py
      - run: zig fmt src build.zig
      - run: zig build test-core -Dheadless-only=true
      - name: Commit compile fixes and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git rm scripts/fix_vim_core_compile.py .github/workflows/fix-vim-core-compile.yml
          git commit -m "fix: compile Vim parity tranche [vim-compile-fixed]"
          git push origin HEAD:feature/v1.0-daily-driver
