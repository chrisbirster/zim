name: v0.5 integration fixes

on:
  push:
    branches:
      - feature/v0.5-zen-workspace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: sed -i 's/error.EditorViewUnbound/BindError.NoBoundEditor/g' scripts/v05_integration_fix.py
      - run: python3 scripts/v05_integration_fix.py
      - run: zig fmt src/editor_view.zig src/tui.zig
      - run: |
          git rm -f .github/workflows/v05-fix.yml scripts/v05_integration_fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/editor_view.zig src/tui.zig
          git commit -m "fix: preserve native-only EditorView tests"
          git push