name: v0.6 Pins patch

on:
  push:
    branches:
      - feature/v0.6-pins

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sed -i 's/if count != 1:/if count < 1:/' scripts/v06_pins_patch.py
      - run: python3 scripts/v06_pins_patch.py
      - name: Normalize Pins native-state JSON
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/editor_view.zig')
          text = p.read_text()
          start = text.index('    const pins_json =')
          marker = '    try context.notify(payload);'
          end = text.index(marker, start) + len(marker)
          replacement = '''    const payload = try std.json.Stringify.valueAlloc(state.editor.allocator, .{
              .mode = state.editor.modeName(),
              .line = position.line,
              .column = position.column,
              .modified = state.editor.currentBuffer().modified,
              .revision = state.editor.currentBuffer().revision,
              .commandOpen = state.editor.commandOpen(),
              .commandText = command,
              .status = state.editor.status(),
              .path = state.editor.currentPath() orelse "[No Name]",
              .project = state.editor.project_root orelse "",
              .buffers = state.editor.buffers.items.len,
              .windows = state.editor.activeTab().window_ids.items.len,
              .tabs = state.editor.tabs.items.len,
              .diagnostics = diagnostics,
              .symbols = symbols,
              .references = references,
              .pins = state.editor.pins.entries.items,
              .pinSwitcherOpen = state.editor.pin_switcher_open,
              .pinSwitcherIndex = state.editor.pin_switcher_index,
          }, .{});
          defer state.editor.allocator.free(payload);
          try context.notify(payload);'''
          p.write_text(text[:start] + replacement + text[end:])
          PY
      - run: |
          sed -i '/var command_escaped:/d; /const safe_command =/d; /var status_escaped:/d; /const safe_status =/d; /var path_escaped:/d; /const safe_path =/d; /var project_escaped:/d; /const safe_project =/d' src/editor_view.zig
          sed -i 's/statFile(self.io, resolved)/statFile(self.io, resolved, .{})/' src/editor.zig
      - run: zig fmt src build.zig
      - run: npm install --no-audit --no-fund
      - run: npm run build:ui
      - run: zig build test-core -Dheadless-only=true
      - run: zig build test-integration
      - run: |
          git rm -f .github/workflows/v06-pins-patch.yml scripts/v06_pins_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src ui build.zig.zon
          git commit -m "feat: integrate Pins across editor API Lua and Zen workspace"
          git push
