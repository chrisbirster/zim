name: v0.6 Pins patch

on:
  push:
    branches:
      - feature/v0.6-pins

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/v06_pins_patch.py
      - run: zig fmt src build.zig
      - run: npm install --no-audit --no-fund
      - run: npm run build:ui
      - run: zig build test-core -Dheadless-only=true
      - run: zig build test-integration
      - run: |
          git rm -f .github/workflows/v06-pins-patch.yml scripts/v06_pins_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src ui build.zig.zon
          git commit -m "feat: integrate Pins across editor API Lua and Zen workspace"
          git push
