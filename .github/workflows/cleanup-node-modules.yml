name: Cleanup Node Modules

on:
  push:
    branches: [feature/v1.0-daily-driver]
    paths:
      - .github/workflows/cleanup-node-modules.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0-daily-driver
          fetch-depth: 0

      - name: Remove accidentally tracked dependencies
        shell: bash
        run: |
          git rm -r node_modules
          rm .github/workflows/cleanup-node-modules.yml
          git add -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove vendored node_modules"
          git push origin HEAD:feature/v1.0-daily-driver
