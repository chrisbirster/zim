name: Apply LSP Editor Integration

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/lsp-phase2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lsp-phase2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Apply guarded editor integration
        run: python3 .github/apply_lsp_editor.py
      - name: Format Zig sources
        run: zig fmt src build.zig
      - name: Verify editor and LSP core
        run: zig build test-core -Dheadless-only=true
      - name: Remove one-shot helpers
        run: rm .github/apply_lsp_editor.py .github/workflows/apply-lsp-editor.yml
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor.zig src/lsp_bridge.zig .github/apply_lsp_editor.py .github/workflows/apply-lsp-editor.yml
          git commit -m "feat(lsp): wire semantic intelligence into editor"
          git push origin HEAD:feature/lsp-phase2
