name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Preserve LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm
        run: npm install --global npm@12.0.2

      - name: Install JavaScript dependencies
        run: npm install

      - name: Check Zig formatting
        run: zig fmt --check zig build.zig

      - name: Test Zig and embedded Solid bundle
        run: zig build test

      - name: Run counter executable smoke
        run: zig build counter-smoke

      - name: Run POSIX PTY lifecycle smoke
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          zig build install
          python3 scripts/pty_smoke.py ./zig-out/bin/hondo-counter --once

      - name: Install Windows ConPTY harness
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check pywinpty==3.0.5

      - name: Run Windows ConPTY lifecycle smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          zig build install
          python scripts/conpty_smoke.py .\zig-out\bin\hondo-counter.exe --once

      - name: Upload Windows ConPTY diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-conpty-diagnostics
          path: conpty-smoke-debug.txt
          if-no-files-found: ignore

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Test TypeScript
        run: npm test

      - name: Build package artifacts
        run: npm run build

      - name: Verify npm package contents
        run: npm run pack:check
